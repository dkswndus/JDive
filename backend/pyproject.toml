[project]
name = "jdive-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sentry-sdk[fastapi]>=2.70.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]

# backend/alembic/ 디렉터리가 있어서 alembic 패키지를 first-party 로 오인한다.
[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# 자동 생성 파일이라 긴 줄(CHECK 식 등)은 그대로 둔다.
"alembic/versions/*" = ["E501"]
